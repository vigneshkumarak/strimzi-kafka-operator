apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 3.8.0
    replicas: 3
    template:
      initContainer:
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
        env:
          - name: FWSS_SECRETS_NAME
            value: local--kafka
          - name: FWSS_LABEL_KEY
            value: fwss.freshworks.com/secrets-managed
          - name: FWSS_LABEL_VALUE
            value: "true"
    rack:
      topologyKey: kubernetes.io/hostname
    brokerRackInitImage: localhost:5001/arunkbha/operator:latest
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: sasl_scram_and_plain
    authorization:
      type: simple
      superUsers:
        - admin
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.8"
    storage:
      type: ephemeral
  zookeeper:
    replicas: 3
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}

